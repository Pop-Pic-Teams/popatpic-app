<script>
        document.addEventListener('DOMContentLoaded', () => {
            const captureBtn = document.getElementById('capture-btn');
            const countdownDisplay = document.getElementById('countdown-display');
            let isCounting = false;

            captureBtn.addEventListener('click', () => {
                if (isCounting) return;
                isCounting = true;
                
                let count = 3;
                countdownDisplay.textContent = count;
                countdownDisplay.classList.remove('scale-100', 'opacity-0');
                countdownDisplay.classList.add('scale-110');
                
                captureBtn.classList.add('opacity-50', 'pointer-events-none');

                const interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownDisplay.style.transform = 'scale(0.8)';
                        setTimeout(() => {
                            countdownDisplay.textContent = count;
                            countdownDisplay.style.transform = 'scale(1.1)';
                        }, 150);
                    } else if (count === 0) {
                        countdownDisplay.textContent = 'Smile!';
                        countdownDisplay.classList.add('text-secondary', 'drop-shadow-[0_8px_30px_rgba(253,86,167,0.8)]');
                        countdownDisplay.classList.remove('drop-shadow-[0_8px_30px_rgba(107,56,212,0.6)]');
                    } else {
                        clearInterval(interval);
                        
                        countdownDisplay.style.opacity = '0';
                        setTimeout(() => {
                            countdownDisplay.textContent = '';
                            countdownDisplay.style.opacity = '1';
                            countdownDisplay.classList.remove('text-secondary', 'drop-shadow-[0_8px_30px_rgba(253,86,167,0.8)]');
                            countdownDisplay.classList.add('drop-shadow-[0_8px_30px_rgba(107,56,212,0.6)]');
                            isCounting = false;
                            captureBtn.classList.remove('opacity-50', 'pointer-events-none');
                        }, 500);
                    }
                }, 1000);
            });
        });
    </script>
